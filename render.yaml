# Render blueprint for the HusAI backend (Express + Prisma, long-running with WS).
# Deploy: Render dashboard → New → Blueprint → connect the HusAI repo.
# Secrets (sync: false) are entered in the dashboard, never committed.
services:
  - type: web
    name: husai-backend
    runtime: node
    rootDir: backend
    plan: free
    # Force dev deps (Render sets NODE_ENV=production, which would skip prisma/tsc),
    # generate the Prisma client, compile, then apply any pending migrations.
    buildCommand: npm install --include=dev && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Non-secret, safe to commit:
      - key: SUPABASE_URL
        value: https://mzxpbrqrbpyhjrwbfmbh.supabase.co
      - key: FRONTEND_ORIGIN
        value: https://hus-ai-five.vercel.app
      # Secrets — set these in the Render dashboard (copy from backend/.env):
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Optional — only needed to hard-delete a user's Supabase auth identity:
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Stripe. Without these, the app runs fine but billing stays disabled -
      # GET /api/billing/plans reports "configured": false and nothing is
      # purchasable. Copy values from backend/.env (test keys, sk_test_...), or
      # switch to live keys (sk_live_...) once ready to charge real cards.
      - key: STRIPE_SECRET_KEY
        sync: false
      # From a webhook endpoint registered against THIS Render URL in the
      # Stripe dashboard (Developers -> Webhooks) - NOT the `stripe listen`
      # CLI's secret, which only forwards to localhost and changes every run.
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PRO_YEARLY
        sync: false
